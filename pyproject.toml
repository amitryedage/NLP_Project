[project]
name = "nlp-visual-lab"
version = "0.1.0"
description = "Interactive NLP Visual Lab for educational demonstration of NLP concepts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.35.0",
    "nltk>=3.8.1",
    "spacy>=3.7.4",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "scikit-learn>=1.4.0",
    "plotly>=5.20.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
]

[tool.uv]
package = false

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
